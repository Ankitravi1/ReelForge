[project]
name = "autitic"
version = "0.1.0"
description = "Autitic Studio — Scalable Multi-Channel Video Production with Decoupled Pipelines"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "python-ulid>=3.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "aiofiles>=24.1",
    "pillow>=10.4",
    "huggingface-hub>=1.30.0",
    "edge-tts>=7.2.8",
    "faster-whisper>=1.2.1",
    "torch>=2.14.0",
    "transformers>=5.16.1",
    "diffusers>=0.40.0",
    "openvino>=2026.3.1",
    "optimum-intel>=1.15.0",
]

[project.scripts]
autitic-api = "autitic.main:dev"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["backend"]
packages = ["backend/autitic"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
